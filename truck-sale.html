<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Trucks for Sale | Dispatch</title><style>
:root{--bg:#0a1320;--gold:#f0b64b;--text:#f2f5f9;--mut:#9fb0c3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(1000px 500px at 85% -10%,#1d3558 0%,transparent 60%),var(--bg);color:var(--text);min-height:100vh}
.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 6%;position:sticky;top:0;z-index:5;background:rgba(10,19,32,.78);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
.brand{font-weight:900;letter-spacing:4px;font-size:18px}.brand i{color:var(--gold);font-style:normal}
.back{color:var(--text);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:10px 16px;border:1px solid rgba(255,255,255,.2);border-radius:999px}.back:hover{background:var(--gold);color:#172638;border-color:var(--gold)}
.wrap{max-width:1200px;margin:0 auto;padding:50px 5% 20px}
.pill{display:inline-block;color:var(--gold);background:rgba(240,182,75,.1);border:1px solid rgba(240,182,75,.3);padding:7px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,54px);line-height:1.05;letter-spacing:-1.5px;margin:20px 0 10px}h1 span{background:linear-gradient(90deg,#f0b64b,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 20px;line-height:1.7;max-width:620px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:30px;font-size:12px;color:var(--mut)}.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{background:rgba(14,26,44,.82);border:1px solid rgba(255,255,255,.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}.card:hover{transform:translateY(-5px);border-color:rgba(240,182,75,.5)}
.img{position:relative;display:block;aspect-ratio:4/3;background-size:cover;background-position:center}
.badge{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(10,19,32,.75);backdrop-filter:blur(8px);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.badge b{width:9px;height:9px;border-radius:50%}
.ref{position:absolute;top:12px;right:12px;padding:6px 10px;border-radius:8px;background:rgba(10,19,32,.65);font-size:10px;font-weight:800;letter-spacing:1px;color:#cfd9e5}
.body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.body h3{margin:0;font-size:18px}
.row small{display:block;font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.route{font-size:15px;font-weight:700}.route em{color:var(--gold);font-style:normal;margin:0 4px}.rate{font-size:22px;font-weight:900;color:var(--gold)}
.sbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.sbar span{text-align:center;padding:7px 2px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:rgba(255,255,255,.06);color:#6f8097}
.s-Available{--c:#4be38f}.s-Pending{--c:#f0b64b}.s-Busy{--c:#ff6b6b}.s-Sold{--c:#ff6b6b}
.sbar span.on{background:var(--c);color:#10202f}.badge b{background:var(--c)}.badge{color:var(--c)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.btns a{text-align:center;text-decoration:none;padding:12px 6px;border-radius:12px;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;transition:.2s}
.wa{background:#25d366;color:#08331b}.gm{border:1.5px solid rgba(255,255,255,.35);color:#fff}.btns a:hover{filter:brightness(1.1);transform:translateY(-2px)}
.card.off .img{filter:grayscale(.8) brightness(.7)}.card.off .btns a{pointer-events:none;opacity:.35}
footer{margin-top:50px;padding:26px 6%;text-align:center;color:#6f8097;font-size:12px;border-top:1px solid rgba(255,255,255,.07)}
.empty{text-align:center;color:#9fb0c3;padding:50px 20px;border:1px dashed rgba(255,255,255,.2);border-radius:18px;line-height:1.7}</style></head><body>
<div class="bar"><div class="brand">DISPATCH<i>.</i></div><a class="back" href="truck-sourcing.html">&larr; Truck options</a></div>
<div class="wrap"><span class="pill">Truck Sourcing</span><h1><span>Trucks for Sale</span></h1><p class="sub">Tap WhatsApp or Gmail on a truck to ask if it is still available.</p><div class="legend"><span><b style="background:#4be38f"></b>Available</span><span><b style="background:#f0b64b"></b>Pending</span><span><b style="background:#ff6b6b"></b>Sold</span></div><p class="empty">No trucks for sale listed yet. Check back soon.</p></div>
<footer>© 2026 DISPATCH. Beyond Borders.</footer></body></html>
